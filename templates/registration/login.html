{% extends "base.html" %}

{% block titre %}Connexion — RedacLo{% endblock %}

{% block contenu %}
    <h2>Connexion</h2>

    {% if form.errors %}
        <p>Nom d'utilisateur ou mot de passe incorrect.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Se connecter</button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e0e0e0; text-align: center;">
        <p style="color: #666; margin-bottom: 1rem;">Vous n'avez pas de compte ?</p>
        <a href="{% url 'articles:soumettre_public' %}" class="btn btn-primary">Proposer un article</a>
    </div>
{% endblock %}
